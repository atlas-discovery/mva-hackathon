[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mva-hackathon"
version = "0.1.0"
description = "Minimal, reproducible variant-to-lever-to-idea workflow for the MVA hackathon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40", "httpx>=0.27"]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
mva = "mva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mva = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
